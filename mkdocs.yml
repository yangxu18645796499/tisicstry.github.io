site_name: Tisicstry's Notes
site_url: https://tisicstry.top/
site_description: 个人学习与研究站点
docs_dir: docs

theme:
  name: material
  language: zh
  font: false  # 不从 Google Fonts 在线加载，改用 docs/fonts 下的自托管字体
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  # 代码块用的等宽字体（正文走系统无衬线字体，无需额外加载）
  - https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono/index.css
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 游戏: games/index.md
